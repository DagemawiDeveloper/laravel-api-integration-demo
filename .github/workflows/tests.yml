name: RelayHub quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish --no-check-lock
      - name: Resolve library dependencies
        run: |
          rm -f composer.lock
          composer update --no-interaction --prefer-dist --no-progress
      - name: Lint PHP files
        run: composer lint
      - name: Run PHPUnit
        run: composer test
